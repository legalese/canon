<text x="998" y="334" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">fear of instant death</text>
<line x1="888" y1="330" x2="910" y2="330" stroke="#9aa0a6" stroke-width="1.4" opacity="1.0"/>
<line x1="1086" y1="330" x2="1108" y2="330" stroke="#9aa0a6" stroke-width="1.4" opacity="1.0"/>
<rect x="910" y="363" width="176" height="38" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" opacity="1.0"/>
<text x="998" y="386" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">fear of instant hurt</text>
<line x1="888" y1="382" x2="910" y2="382" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
<line x1="1086" y1="382" x2="1108" y2="382" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
