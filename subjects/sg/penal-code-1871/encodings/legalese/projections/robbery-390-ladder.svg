<line x1="888" y1="278" x2="910" y2="278" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
<line x1="1086" y1="278" x2="1108" y2="278" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
