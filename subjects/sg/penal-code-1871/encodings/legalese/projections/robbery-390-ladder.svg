<line x1="1086" y1="226" x2="1108" y2="226" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
<rect x="910" y="259" width="176" height="38" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" opacity="1.0"/>
