<text x="40" y="568" font-family="Georgia, serif" font-size="17" font-weight="700" text-anchor="start" fill="#222" opacity="1.0">s 390(3) — when extortion is robbery</text>
<text x="40" y="587" font-family="Georgia, serif" font-size="12" font-weight="400" text-anchor="start" fill="#555" opacity="1.0" font-style="italic">Wholly grey: this was a theft-robbery, so the other limb of s 390(1) is unused.</text>
<rect x="64" y="689" width="176" height="38" rx="7" fill="#f4f8f5" stroke="#9aa0a6" stroke-width="1.5" opacity="1.0"/>
<text x="152" y="712" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">commits extortion (s 383)</text>
<text x="152" y="674" font-family="Georgia, serif" font-size="11" font-weight="400" text-anchor="middle" fill="#555" opacity="1.0" font-style="italic">s 390(1): there is an extortion</text>
<rect x="280" y="685" width="188" height="46" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5" opacity="1.0"/>
<text x="374" y="704" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">in the presence of the</text>
<text x="374" y="720" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">person put in fear</text>
<text x="374" y="674" font-family="Georgia, serif" font-size="11" font-weight="400" text-anchor="middle" fill="#555" opacity="1.0" font-style="italic">Explanation: near enough</text>
