<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="896" viewBox="0 0 1180 896">
<rect width="1180" height="896" fill="#ffffff"/>
<text x="590" y="30" font-family="Georgia, serif" font-size="17" font-weight="700" text-anchor="middle" fill="#222" opacity="1.0">Penal Code 1871, s 390 — when a theft or an extortion becomes robbery</text>
<text x="590" y="52" font-family="Georgia, serif" font-size="12" font-weight="400" text-anchor="middle" fill="#444" opacity="1.0" font-style="italic">s 390(1): “In all robbery there is either theft or extortion.”  The two panels are the two subsections, and they are in PARALLEL — either one makes out robbery.</text>
<text x="590" y="70" font-family="Georgia, serif" font-size="12" font-weight="400" text-anchor="middle" fill="#444" opacity="1.0" font-style="italic">Green carries current on the facts of Chen Weixiong Jerriek v PP [2003] SGHC 103, as encoded. Grey does not.</text>
<text x="40" y="108" font-family="Georgia, serif" font-size="17" font-weight="700" text-anchor="start" fill="#222" opacity="1.0">s 390(2) — when theft is robbery</text>
<text x="40" y="127" font-family="Georgia, serif" font-size="12" font-weight="400" text-anchor="start" fill="#555" opacity="1.0" font-style="italic">In series: the theft, then WHEN, then the purpose, then the act, then the harm.</text>
<rect x="64" y="289" width="176" height="38" rx="7" fill="#f4f8f5" stroke="#1a7f37" stroke-width="1.5" opacity="1.0"/>
<text x="152" y="312" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">commits theft (s 378)</text>
<text x="152" y="274" font-family="Georgia, serif" font-size="11" font-weight="400" text-anchor="middle" fill="#555" opacity="1.0" font-style="italic">s 390(1): there is a theft</text>
<rect x="280" y="218" width="188" height="38" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5" opacity="1.0"/>
<text x="374" y="241" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">in order to commit theft</text>
<line x1="258" y1="237" x2="280" y2="237" stroke="#9aa0a6" stroke-width="1.4" opacity="1.0"/>
<line x1="468" y1="237" x2="490" y2="237" stroke="#9aa0a6" stroke-width="1.4" opacity="1.0"/>
<rect x="280" y="270" width="188" height="38" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" opacity="1.0"/>
<text x="374" y="293" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">in committing the theft</text>
<line x1="258" y1="289" x2="280" y2="289" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
<line x1="468" y1="289" x2="490" y2="289" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
<rect x="280" y="322" width="188" height="76" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5" opacity="1.0"/>
<text x="374" y="342" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">in carrying away or</text>
<text x="374" y="356" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">attempting to carry away</text>
<text x="374" y="372" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">property obtained by the</text>
<text x="374" y="386" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">theft</text>
<line x1="258" y1="360" x2="280" y2="360" stroke="#9aa0a6" stroke-width="1.4" opacity="1.0"/>
<line x1="468" y1="360" x2="490" y2="360" stroke="#9aa0a6" stroke-width="1.4" opacity="1.0"/>
<line x1="258" y1="237" x2="258" y2="360" stroke="#3a3a3a" stroke-width="1.4" opacity="1.0"/>
<line x1="490" y1="237" x2="490" y2="360" stroke="#3a3a3a" stroke-width="1.4" opacity="1.0"/>
<text x="374" y="206" font-family="Georgia, serif" font-size="11" font-weight="400" text-anchor="middle" fill="#555" opacity="1.0" font-style="italic">“in order to … or in …”</text>
<rect x="530" y="289" width="128" height="38" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" opacity="1.0"/>
<text x="594" y="312" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">for that end</text>
<text x="594" y="274" font-family="Georgia, serif" font-size="11" font-weight="400" text-anchor="middle" fill="#555" opacity="1.0" font-style="italic">the purposive link</text>
<rect x="698" y="263" width="150" height="38" rx="7" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" opacity="1.0"/>
<text x="773" y="286" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">voluntarily causes</text>
<line x1="676" y1="282" x2="698" y2="282" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
<line x1="848" y1="282" x2="870" y2="282" stroke="#1a7f37" stroke-width="1.4" opacity="1.0"/>
<rect x="698" y="315" width="150" height="38" rx="7" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5" opacity="1.0"/>
<text x="773" y="338" font-family="Georgia, serif" font-size="13" font-weight="400" text-anchor="middle" fill="#222" opacity="1.0">attempts to cause</text>
<line x1="676" y1="334" x2="698" y2="334" stroke="#9aa0a6" stroke-width="1.4" opacity="1.0"/>
<line x1="848" y1="334" x2="870" y2="334" stroke="#9aa0a6" stroke-width="1.4" opacity="1.0"/>
<line x1="676" y1="282" x2="676" y2="334" stroke="#3a3a3a" stroke-width="1.4" opacity="1.0"/>
<line x1="870" y1="282" x2="870" y2="334" stroke="#3a3a3a" stroke-width="1.4" opacity="1.0"/>
<text x="773" y="251" font-family="Georgia, serif" font-size="11" font-weight="400" text-anchor="middle" fill="#555" opacity="1.0" font-style="italic">causes or attempts</text>
